name: Cross-platform builds and releases

on:
  pull_request:
    branches: [main]
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            id: windows-x64
            runner: windows-latest
            artifact-path: release/Focus-Tracker-Setup-*.exe
          - name: macOS universal
            id: macos-universal
            runner: macos-latest
            artifact-path: |
              release/Focus-Tracker-*-mac-universal.dmg
              release/Focus-Tracker-*-mac-universal.zip
          - name: Linux x64
            id: linux-x64
            runner: ubuntu-latest
            artifact-path: |
              release/Focus-Tracker-*-linux-x64.AppImage
              release/Focus-Tracker-*-linux-x64.deb
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Verify release tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: node -e "const expected = 'v' + require('./package.json').version; if (process.env.GITHUB_REF_NAME !== expected) throw new Error('Expected tag ' + expected + ', got ' + process.env.GITHUB_REF_NAME)"
      - name: Generate macOS application icon
        if: runner.os == 'macOS'
        run: bash tools/create-macos-icon.sh
      - name: Build for Windows
        if: runner.os == 'Windows'
        run: |
          if ($env:WIN_CSC_LINK -and $env:WIN_CSC_KEY_PASSWORD) {
            npm run dist:win -- --config.forceCodeSigning=true
          } else {
            npm run dist:win
          }
        env:
          WIN_CSC_LINK: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && secrets.WINDOWS_CSC_LINK || '' }}
          WIN_CSC_KEY_PASSWORD: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && secrets.WINDOWS_CSC_KEY_PASSWORD || '' }}
      - name: Build and notarize for macOS
        if: runner.os == 'macOS'
        run: |
          if [[ -n "$CSC_LINK" && -n "$CSC_KEY_PASSWORD" ]]; then
            if [[ -n "$APPLE_API_KEY_P8_BASE64" && -n "$APPLE_API_KEY_ID" && -n "$APPLE_API_ISSUER" ]]; then
              umask 077
              printf '%s' "$APPLE_API_KEY_P8_BASE64" | base64 -D > "$RUNNER_TEMP/AuthKey.p8"
              export APPLE_API_KEY="$RUNNER_TEMP/AuthKey.p8"
              npm run dist:mac -- --config.forceCodeSigning=true --config.mac.notarize=true
            else
              npm run dist:mac -- --config.forceCodeSigning=true
            fi
          else
            npm run dist:mac
          fi
        env:
          CSC_LINK: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && secrets.MACOS_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && secrets.MACOS_CSC_KEY_PASSWORD || '' }}
          APPLE_API_KEY_P8_BASE64: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && secrets.APPLE_API_KEY_P8_BASE64 || '' }}
          APPLE_API_KEY_ID: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && secrets.APPLE_API_ISSUER || '' }}
      - name: Build for Linux
        if: runner.os == 'Linux'
        run: npm run dist:linux
      - name: Upload platform packages
        uses: actions/upload-artifact@v4
        with:
          name: focus-tracker-${{ matrix.id }}
          path: ${{ matrix.artifact-path }}
          if-no-files-found: error
          retention-days: 30

  draft-release:
    name: Prepare draft GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
      - name: Download platform packages
        uses: actions/download-artifact@v4
        with:
          pattern: focus-tracker-*
          path: release-assets
          merge-multiple: true
      - name: Generate checksums and release notes
        run: node tools/release-artifacts.cjs release-assets
        env:
          WINDOWS_SIGNED: ${{ secrets.WINDOWS_CSC_LINK != '' && secrets.WINDOWS_CSC_KEY_PASSWORD != '' && 'true' || 'false' }}
          MACOS_SIGNED: ${{ secrets.MACOS_CSC_LINK != '' && secrets.MACOS_CSC_KEY_PASSWORD != '' && 'true' || 'false' }}
          MACOS_NOTARIZED: ${{ secrets.MACOS_CSC_LINK != '' && secrets.MACOS_CSC_KEY_PASSWORD != '' && secrets.APPLE_API_KEY_P8_BASE64 != '' && secrets.APPLE_API_KEY_ID != '' && secrets.APPLE_API_ISSUER != '' && 'true' || 'false' }}
      - name: Create unpublished draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            is_draft="$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq '.isDraft')"
            if [[ "$is_draft" != "true" ]]; then
              echo "Refusing to overwrite an already published release." >&2
              exit 1
            fi
            gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
            gh release edit "$GITHUB_REF_NAME" --draft --verify-tag --title "Focus Tracker $GITHUB_REF_NAME" --notes-file release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" release-assets/* --draft --verify-tag --title "Focus Tracker $GITHUB_REF_NAME" --notes-file release-notes.md
          fi
